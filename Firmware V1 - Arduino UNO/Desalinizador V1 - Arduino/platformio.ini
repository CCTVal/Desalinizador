; Env para Arduino UNO 
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = 
  playingwithfusion/PWFusion_Max31865 @ ^2.1.0
  luisllamasbinaburo/I2CScanner @ ^1.0.1

